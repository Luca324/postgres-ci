name: 04 - Advanced Monitoring Test with Docker Compose

on:
  workflow_dispatch:
    inputs:
      postgres-version:
        description: 'PostgreSQL version'
        required: true
        default: '15'
      test-duration:
        description: 'test duration in seconds'
        required: true
        default: '60'

jobs:
  full-monitoring:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create docker-compose.yml
      run: |
        cat > docker-compose.yml << EOF
        version: '3.8'
        
        services:
          postgres:
            image: postgres:${{ github.evernt.inputs.postgres-version }}
            environment:
              POSTGRES_PASSWORD: testpassword
              POSTGRES_DB: monitoring_db 
            ports: 
              - "5432:5432"
            volumes:
              - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
              - postgres_data:/var/lib/postgresql/data
            healthcheck:
              test: ["CMD-SHELL", "pg_isready -U postgres"]
              interval: 10s
              timeout: 5s
              retries: 5

          pgadmin:
            image: dpage/pgadmin4
            command: >
              sh -c "
              apk add --no-cache postgresql-client curl && sleep 10 && ./monitor.sh"
            volumes:
              - ./scripts/monitor.sh:/monitor.sh
              - ./scripts:/scripts
            depends_on:
              postgres:
                condition: service_healthy

        volumes:
          postgres_data:
        EOF
    - name: Create initialization script
      run: |
        mkdir -p scripts
        
        cat > scripts/init.sql << 'EOF'
        -- Инициализация базы для мониторинга
        
        -- Создаем схему для мониторинга
        CREATE SCHEMA IF NOT EXISTS monitoring;
        
        -- Таблица для метрик
        CREATE TABLE monitoring.metrics (
            id BIGSERIAL PRIMARY KEY,
            metric_name VARCHAR(100) NOT NULL,
            metric_value NUMERIC(15,6),
            labels JSONB DEFAULT '{}',
            timestamp TIMESTAMPTZ DEFAULT NOW()
        );
        
        -- Таблица для алертов
        CREATE TABLE monitoring.alerts (
            id BIGSERIAL PRIMARY KEY,
            alert_name VARCHAR(100) NOT NULL,
            severity VARCHAR(20) CHECK (severity IN ('LOW', 'MEDIUM', 'HIGH', 'CRITICAL')),
            message TEXT,
            triggered_at TIMESTAMPTZ DEFAULT NOW(),
            resolved_at TIMESTAMPTZ,
            is_active BOOLEAN DEFAULT true
        );
        
        -- Функция для сбора метрик
        CREATE OR REPLACE FUNCTION monitoring.collect_metrics()
        RETURNS VOID AS \$\$
        BEGIN
            -- Собираем системные метрики
            INSERT INTO monitoring.metrics (metric_name, metric_value, labels)
            VALUES 
                ('active_connections', 
                 (SELECT COUNT(*) FROM pg_stat_activity WHERE state = 'active'),
                 '{"type": "connections"}'),
                
                ('cache_hit_ratio',
                 (SELECT 
                    CASE WHEN blks_hit + blks_read > 0 
                    THEN (blks_hit * 100.0 / (blks_hit + blks_read))
                    ELSE 100 END
                  FROM pg_stat_database WHERE datname = current_database()),
                 '{"type": "performance"}'),
                
                ('database_size_mb',
                 (SELECT pg_database_size(current_database()) / 1048576.0),
                 '{"type": "storage"}');
        END;
        \$\$ LANGUAGE plpgsql;
        
        -- Создаем расширение для статистики (эмулируем Postgres Pro расширение)
        CREATE TABLE monitoring.custom_stats (
            stat_id SERIAL PRIMARY KEY,
            stat_name VARCHAR(50),
            query_text TEXT,
            last_executed TIMESTAMPTZ,
            avg_duration_ms FLOAT
        );
        
        -- Вставляем тестовые запросы для мониторинга
        INSERT INTO monitoring.custom_stats (stat_name, query_text) VALUES
            ('slow_queries', 'SELECT * FROM pg_stat_statements ORDER BY mean_time DESC LIMIT 10'),
            ('table_sizes', 'SELECT schemaname, tablename, pg_size_pretty(pg_total_relation_size(schemaname||''.''||tablename)) FROM pg_tables ORDER BY pg_total_relation_size(schemaname||''.''||tablename) DESC'),
            ('index_usage', 'SELECT * FROM pg_stat_user_indexes WHERE idx_scan < 100');
        EOF
        
        # Создаем скрипт мониторинга
        cat > scripts/monitor.sh << 'EOF'
        #!/bin/sh
        set -e
        
        echo "Starting monitoring script..."
        
        # Функция для сбора метрик
        collect_metrics() {
            echo "Collecting metrics at $(date)"
            
            PGPASSWORD=testpassword psql -h postgres -U postgres -d monitoring_db << SQL
            -- Вызываем функцию сбора метрик
            SELECT monitoring.collect_metrics();
            
            -- Получаем текущие метрики
            SELECT 
                metric_name,
                ROUND(AVG(metric_value), 2) as avg_value,
                COUNT(*) as samples
            FROM monitoring.metrics 
            WHERE timestamp > NOW() - INTERVAL '5 minutes'
            GROUP BY metric_name;
            
            -- Проверяем на алерты
            INSERT INTO monitoring.alerts (alert_name, severity, message)
            SELECT 
                'high_connections',
                CASE WHEN metric_value > 50 THEN 'CRITICAL'
                     WHEN metric_value > 20 THEN 'HIGH'
                     ELSE NULL END,
                'High number of active connections: ' || metric_value
            FROM monitoring.metrics 
            WHERE metric_name = 'active_connections'
            AND timestamp > NOW() - INTERVAL '1 minute'
            AND metric_value > 20
            AND NOT EXISTS (
                SELECT 1 FROM monitoring.alerts 
                WHERE alert_name = 'high_connections' 
                AND is_active = true
            );
            SQL
        }
        
        # Запускаем нагрузочный тест в фоне
        echo "Starting load test..."
        PGPASSWORD=testpassword pgbench -h postgres -U postgres -i -s 50 monitoring_db &
        PGPASSWORD=testpassword pgbench -h postgres -U postgres -c 10 -T ${{ github.event.inputs.test-duration }} monitoring_db &
        
        # Собираем метрики каждые 10 секунд
        for i in $(seq 1 $(( {{ github.event.inputs.test-duration }} / 10 ))); do
            collect_metrics
            sleep 10
        done
        
        # Финальный сбор метрик
        echo "Test completed. Final metrics:"
        PGPASSWORD=testpassword psql -h postgres -U postgres -d monitoring_db << SQL
        SELECT 
            '=== FINAL REPORT ===' as report,
            '' as empty;
        
        SELECT 
            metric_name,
            MIN(metric_value) as min,
            MAX(metric_value) as max,
            AVG(metric_value) as avg,
            COUNT(*) as samples
        FROM monitoring.metrics
        GROUP BY metric_name;
        
        SELECT 
            '=== ACTIVE ALERTS ===' as alerts_header,
            '' as empty;
        
        SELECT 
            alert_name,
            severity,
            message,
            triggered_at
        FROM monitoring.alerts
        WHERE is_active = true;
        SQL
        EOF
        
        chmod +x scripts/monitor.sh
    
    - name: Start services with Docker Compose 
      run: |
        echo "Waiting for PostgreSQL to be ready..."
        timeout 60 bash -c 'until docker-compose exec postgres pg_isready -U postgrer; do sleep 2; done'

    - name: Run monitoring test
      timeout-minutes: 5
      run: |
        echo "Running monitoring test for ${{ github.event.inputs.test-duration }} seconds..."

        docker-compose up monitor 2> &1 | tee monitoring.log
        docker-compose logs postgres > postgres.log

    - name: Collect and save results
      if: always()
      run: |
        mkdir -p monitoring-results

        cp monitoring.log monitoring-resuls/
        cp postgres.log monitoring-resuls/

        docker-compose exec -T postgres psql -U postgres -d monitoring_db -c "
        \copy (SELECT * FROM monitoring.metrics ORDER BY timestamp) TO '/tmp/metrics.csv' CSV HEADER;
        \copy (SELECT * FROM monitoring.alerts ORDER BY triggered_at) TO '/tmp/alerts.csv' CSV HEADER;

        docker cp $(docker-compose ps -q postgres):/tmp/metrics.csv monitoring-results/
        docker cp $(docker-compose ps -q postgres):/tmp/alerts.csv monitoring-results/
        
        echo "=== MONITORING TEST REPORT ===" > monitoring-results/report.txt
        echo "PostgreSQL Version: ${{ github.event.inputs.postgres-version }}" >> monitoring-results/report.txt
        echo "Test Duration: ${{ github.event.inputs.test-duration }} seconds" >> monitoring-results/report.txt
        echo "Test Date: $(date)" >> monitoring-results/report.txt
        echo "" >> monitoring-results/report.txt
        
        echo "Metrics Collected:" >> monitoring-results/report.txt
        wc -l monitoring-results/metrics.csv >> monitoring-results/report.txt
        
        echo "" >> monitoring-results/report.txt
        echo "Alerts Triggered:" >> monitoring-results/report.txt
        tail -n +2 monitoring-results/alerts.csv | wc -l >> monitoring-results/report.txt
        
    - name: Upload monitoring results
      uses: actions/upload-artifact@v4
      with: 
        name: monitoring-resuls-v${{ github.event.inputs.postgres-version }}
        path: monitoring-resuls/

    - name: Cleanup
      if: always()
      run: |
        docker-compose down -v