name: 04 - Advanced Monitoring Test with Docker Compose

on:
  workflow_dispatch:
    inputs:
      postgres-version:
        description: 'PostgreSQL version'
        required: true
        default: '15'
      test-duration:
        description: 'Test duration in seconds'
        required: true
        default: '60'

jobs:
  full-monitoring:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Docker Compose
      run: |
        # Устанавливаем Docker Compose
        sudo curl -L "https://github.com/docker/compose/releases/download/v2.23.0/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
        sudo chmod +x /usr/local/bin/docker-compose
        docker-compose --version

    - name: Create docker-compose.yml
      run: |
        cat > docker-compose.yml << EOF
        version: '3.8'
        
        services:
          postgres:
            image: postgres:${{ github.event.inputs.postgres-version }}
            environment:
              POSTGRES_PASSWORD: testpassword
              POSTGRES_DB: monitoring_db 
            ports: 
              - "5432:5432"
            volumes:
              - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
              - postgres_data:/var/lib/postgresql/data
            healthcheck:
              test: ["CMD-SHELL", "pg_isready -U postgres"]
              interval: 10s
              timeout: 5s
              retries: 5

          monitor:
            image: alpine:latest
            command: >
              sh -c "
              apk add --no-cache postgresql-client curl &&
              chmod +x /monitor.sh &&
              sleep 15 &&
              /monitor.sh
              "
            volumes:
              - ./scripts/monitor.sh:/monitor.sh
              - ./scripts:/scripts
            depends_on:
              postgres:
                condition: service_healthy

        volumes:
          postgres_data:
        EOF
        
        # Выводим созданный файл для отладки
        echo "=== docker-compose.yml ==="
        cat docker-compose.yml

    - name: Create initialization script
      run: |
        mkdir -p scripts
        
        cat > scripts/init.sql << 'EOF'
        -- Инициализация базы для мониторинга
        
        -- Создаем схему для мониторинга
        CREATE SCHEMA IF NOT EXISTS monitoring;
        
        -- Таблица для метрик
        CREATE TABLE monitoring.metrics (
            id BIGSERIAL PRIMARY KEY,
            metric_name VARCHAR(100) NOT NULL,
            metric_value NUMERIC(15,6),
            labels JSONB DEFAULT '{}',
            timestamp TIMESTAMPTZ DEFAULT NOW()
        );
        
        -- Таблица для алертов
        CREATE TABLE monitoring.alerts (
            id BIGSERIAL PRIMARY KEY,
            alert_name VARCHAR(100) NOT NULL,
            severity VARCHAR(20) CHECK (severity IN ('LOW', 'MEDIUM', 'HIGH', 'CRITICAL')),
            message TEXT,
            triggered_at TIMESTAMPTZ DEFAULT NOW(),
            resolved_at TIMESTAMPTZ,
            is_active BOOLEAN DEFAULT true
        );
        
        -- Функция для сбора метрик
        CREATE OR REPLACE FUNCTION monitoring.collect_metrics()
        RETURNS VOID AS \$\$
        BEGIN
            -- Собираем системные метрики
            INSERT INTO monitoring.metrics (metric_name, metric_value, labels)
            VALUES 
                ('active_connections', 
                 (SELECT COUNT(*) FROM pg_stat_activity WHERE state = 'active'),
                 '{"type": "connections"}'),
                
                ('cache_hit_ratio',
                 (SELECT 
                    CASE WHEN blks_hit + blks_read > 0 
                    THEN (blks_hit * 100.0 / (blks_hit + blks_read))
                    ELSE 100 END
                  FROM pg_stat_database WHERE datname = current_database()),
                 '{"type": "performance"}'),
                
                ('database_size_mb',
                 (SELECT pg_database_size(current_database()) / 1048576.0),
                 '{"type": "storage"}');
        END;
        \$\$ LANGUAGE plpgsql;
        
        -- Создаем расширение для статистики (эмулируем Postgres Pro расширение)
        CREATE TABLE monitoring.custom_stats (
            stat_id SERIAL PRIMARY KEY,
            stat_name VARCHAR(50),
            query_text TEXT,
            last_executed TIMESTAMPTZ,
            avg_duration_ms FLOAT
        );
        
        -- Вставляем тестовые запросы для мониторинга
        INSERT INTO monitoring.custom_stats (stat_name, query_text) VALUES
            ('slow_queries', 'SELECT * FROM pg_stat_statements ORDER BY mean_time DESC LIMIT 10'),
            ('table_sizes', 'SELECT schemaname, tablename, pg_size_pretty(pg_total_relation_size(schemaname||''.''||tablename)) FROM pg_tables ORDER BY pg_total_relation_size(schemaname||''.''||tablename) DESC'),
            ('index_usage', 'SELECT * FROM pg_stat_user_indexes WHERE idx_scan < 100');
        EOF
        
        # Создаем скрипт мониторинга с фиксами
        cat > scripts/monitor.sh << 'EOF'
        #!/bin/sh
        set -e
        
        echo "Starting monitoring script..."
        
        # Установка pgbench если нужно
        if ! command -v pgbench &> /dev/null; then
            echo "Installing pgbench..."
            apk add --no-cache postgresql-contrib
        fi
        
        # Функция для сбора метрик
        collect_metrics() {
            echo "Collecting metrics at $(date)"
            
            PGPASSWORD=testpassword psql -h postgres -U postgres -d monitoring_db << 'SQL'
            -- Вызываем функцию сбора метрик
            SELECT monitoring.collect_metrics();
            
            -- Получаем текущие метрики
            SELECT 
                metric_name,
                ROUND(AVG(metric_value)::numeric, 2) as avg_value,
                COUNT(*) as samples
            FROM monitoring.metrics 
            WHERE timestamp > NOW() - INTERVAL '5 minutes'
            GROUP BY metric_name;
            
            -- Проверяем на алерты
            INSERT INTO monitoring.alerts (alert_name, severity, message)
            SELECT 
                'high_connections',
                CASE WHEN metric_value > 50 THEN 'CRITICAL'
                     WHEN metric_value > 20 THEN 'HIGH'
                     ELSE NULL END,
                'High number of active connections: ' || metric_value
            FROM monitoring.metrics 
            WHERE metric_name = 'active_connections'
            AND timestamp > NOW() - INTERVAL '1 minute'
            AND metric_value > 20
            AND NOT EXISTS (
                SELECT 1 FROM monitoring.alerts 
                WHERE alert_name = 'high_connections' 
                AND is_active = true
            );
            SQL
        }
        
        # Запускаем нагрузочный тест в фоне
        echo "Starting load test..."
        PGPASSWORD=testpassword pgbench -h postgres -U postgres -i -s 10 monitoring_db 2>&1 &
        sleep 5
        
        DURATION=$1
        echo "Running benchmark for $DURATION seconds..."
        PGPASSWORD=testpassword pgbench -h postgres -U postgres -c 5 -T $DURATION monitoring_db 2>&1 &
        
        # Собираем метрики каждые 10 секунд
        INTERVAL=10
        ITERATIONS=$((DURATION / INTERVAL))
        
        for i in $(seq 1 $ITERATIONS); do
            echo "Iteration $i/$ITERATIONS"
            collect_metrics
            sleep $INTERVAL
        done
        
        # Финальный сбор метрик
        echo "Test completed. Final metrics:"
        PGPASSWORD=testpassword psql -h postgres -U postgres -d monitoring_db << 'SQL'
        SELECT 
            '=== FINAL REPORT ===' as report,
            '' as empty;
        
        SELECT 
            metric_name,
            MIN(metric_value) as min,
            MAX(metric_value) as max,
            AVG(metric_value) as avg,
            COUNT(*) as samples
        FROM monitoring.metrics
        GROUP BY metric_name;
        
        SELECT 
            '=== ACTIVE ALERTS ===' as alerts_header,
            '' as empty;
        
        SELECT 
            alert_name,
            severity,
            message,
            triggered_at
        FROM monitoring.alerts
        WHERE is_active = true;
        SQL
        EOF
        
        chmod +x scripts/monitor.sh
        
        # Показываем созданные файлы
        echo "=== Scripts created ==="
        ls -la scripts/
        head -20 scripts/monitor.sh

    - name: Start services with Docker Compose 
      run: |
        echo "Starting Docker Compose services..."
        docker-compose up -d
        
        echo "Checking running containers..."
        docker-compose ps
        
        echo "Waiting for PostgreSQL to be ready..."
        timeout 120 bash -c 'until docker-compose exec postgres pg_isready -U postgres 2>/dev/null; do 
          echo "Waiting..."; 
          sleep 5; 
          docker-compose logs postgres --tail=5; 
        done'
        
        echo "PostgreSQL is ready!"
        docker-compose exec postgres psql -U postgres -c "SELECT version();"

    - name: Run monitoring test
      timeout-minutes: 5
      run: |
        echo "Running monitoring test for ${{ github.event.inputs.test-duration }} seconds..."
        
        # Передаем длительность теста в скрипт
        docker-compose run --rm monitor sh -c "/monitor.sh ${{ github.event.inputs.test-duration }}" 2>&1 | tee monitoring.log
        
        # Копируем логи PostgreSQL
        docker-compose logs postgres > postgres.log 2>&1

    - name: Collect and save results
      if: always()
      run: |
        echo "Collecting results..."
        mkdir -p monitoring-results
        
        # Копируем логи если они существуют
        if [ -f monitoring.log ]; then
          cp monitoring.log monitoring-results/
          echo "✅ monitoring.log copied"
        else
          echo "⚠️ monitoring.log not found"
        fi
        
        if [ -f postgres.log ]; then
          cp postgres.log monitoring-results/
          echo "✅ postgres.log copied"
        else
          echo "⚠️ postgres.log not found"
        fi
        
        # Экспортируем данные из БД если она доступна
        if docker-compose ps postgres | grep -q "Up"; then
          echo "Exporting metrics from database..."
          
          # Создаем директорию для экспорта внутри контейнера
          docker-compose exec -T postgres bash -c "mkdir -p /tmp/export"
          
          # Экспортируем данные
          docker-compose exec -T postgres psql -U postgres -d monitoring_db -c "
            \copy (SELECT * FROM monitoring.metrics ORDER BY timestamp) TO '/tmp/export/metrics.csv' CSV HEADER;
            \copy (SELECT * FROM monitoring.alerts ORDER BY triggered_at) TO '/tmp/export/alerts.csv' CSV HEADER;
          " || echo "Failed to export data, continuing..."
          
          # Копируем файлы из контейнера
          docker cp $(docker-compose ps -q postgres):/tmp/export/. monitoring-results/ 2>/dev/null || true
        else
          echo "⚠️ PostgreSQL container is not running, skipping data export"
        fi
        
        # Генерируем отчет
        echo "=== MONITORING TEST REPORT ===" > monitoring-results/report.txt
        echo "PostgreSQL Version: ${{ github.event.inputs.postgres-version }}" >> monitoring-results/report.txt
        echo "Test Duration: ${{ github.event.inputs.test-duration }} seconds" >> monitoring-results/report.txt
        echo "Test Date: $(date)" >> monitoring-results/report.txt
        echo "" >> monitoring-results/report.txt
        
        # Добавляем информацию о собранных данных
        if [ -f "monitoring-results/metrics.csv" ]; then
          METRICS_COUNT=$(tail -n +2 monitoring-results/metrics.csv 2>/dev/null | wc -l || echo "0")
          echo "Metrics Collected: $METRICS_COUNT" >> monitoring-results/report.txt
        else
          echo "Metrics Collected: 0 (file not found)" >> monitoring-results/report.txt
        fi
        
        if [ -f "monitoring-results/alerts.csv" ]; then
          ALERTS_COUNT=$(tail -n +2 monitoring-results/alerts.csv 2>/dev/null | wc -l || echo "0")
          echo "Alerts Triggered: $ALERTS_COUNT" >> monitoring-results/report.txt
        else
          echo "Alerts Triggered: 0 (file not found)" >> monitoring-results/report.txt
        fi
        
        echo "" >> monitoring-results/report.txt
        echo "=== DOCKER STATUS ===" >> monitoring-results/report.txt
        docker-compose ps >> monitoring-results/report.txt 2>&1 || true
        
        # Показываем что собрали
        echo "=== Collected files ==="
        ls -la monitoring-results/

    - name: Upload monitoring results
      uses: actions/upload-artifact@v4
      with: 
        name: monitoring-results-v${{ github.event.inputs.postgres-version }}
        path: monitoring-results/

    - name: Cleanup
      if: always()
      run: |
        echo "Cleaning up Docker resources..."
        docker-compose down -v 2>/dev/null || true
        docker system prune -f 2>/dev/null || true
        echo "Cleanup completed"