name: Postgres Pro Installation Test

on: [push, pull_request]

jobs:
  install-defferent-postgres-versions:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        postgres-version: [14, 15, 16]
        include:
          - postgres-version: 14
            port: 5432
          - postgres-version: 15
            port: 5433
          - postgres-version: 16
            port: 5434
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Start PostgreSQL ${{ matrix.postgres-version }} in Docker
      run: |
        echo "Starting PostgreSQL ${{ matrix.postgres-version }} on port ${{ matrix.port }}"
        
        docker run -d \
          --name postgres-${{ matrix.postgres-version }} \
          -e POSTGRES_PASSWORD=testpass \
          -p ${{ matrix.port }}:5432 \
          postgres:${{ matrix.postgres-version }}
        
        # Ждем пока PostgreSQL запустится
        sleep 10
        
        # Проверяем что контейнер работает
        docker ps | grep postgres-${{ matrix.postgres-version }}
    
    - name: Test connection
      run: |
        echo "Testing PostgreSQL ${{ matrix.postgres-version }} on localhost:${{ matrix.port }}"
        
        # Устанавливаем клиент (уже должен быть установлен)
        sudo apt-get update
        sudo apt-get install -y postgresql-client
        
        # Проверяем подключение
        PGPASSWORD=testpass psql -h localhost -p ${{ matrix.port }} -U postgres -c "SELECT version();"
    
    - name: Create test database and run queries
      run: |
        PGPASSWORD=testpass psql -h localhost -p ${{ matrix.port }} -U postgres -c "CREATE DATABASE test_db;"
        
        PGPASSWORD=testpass psql -h localhost -p ${{ matrix.port }} -U postgres -d test_db -c "
          -- Создаем тестовую таблицу
          CREATE TABLE version_test (
            id SERIAL PRIMARY KEY,
            postgres_version TEXT DEFAULT '${{ matrix.postgres-version }}',
            test_time TIMESTAMP DEFAULT NOW(),
            test_data TEXT
          );
          
          -- Вставляем тестовые данные
          INSERT INTO version_test (test_data) VALUES 
            ('Test data for PostgreSQL ${{ matrix.postgres-version }}'),
            ('Running on port ${{ matrix.port }}');
          
          -- Проверяем
          SELECT * FROM version_test;
        "
    
    - name: Install pgbench and run simple test
      run: |
        # Устанавливаем pgbench
        sudo apt-get install -y postgresql-contrib
        
        # Инициализируем pgbench
        PGPASSWORD=testpass pgbench -h localhost -p ${{ matrix.port }} -U postgres -i -s 5 test_db
        
        # Запускаем короткий тест
        echo "=== Pgbench test for PostgreSQL ${{ matrix.postgres-version }} ==="
        PGPASSWORD=testpass pgbench -h localhost -p ${{ matrix.port }} -U postgres -c 2 -T 10 test_db
    
    - name: Cleanup
      if: always()
      run: |
        docker stop postgres-${{ matrix.postgres-version }} || true
        docker rm postgres-${{ matrix.postgres-version }} || true